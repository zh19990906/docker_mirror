worker_processes 1;
error_log logs/error.log warn;
events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log logs/access.log main;

    server {
        listen 8080;

        # 动态代理：/proxy/<port>/path → http://127.0.0.1:<port>/path
        location ~ ^/proxy/(\d+)/(.*)$ {
            set $port $1;
            set $path $2;

            # 🔒 安全限制：仅允许特定端口范围（按需调整）
            if ($port !~ "^(2[0-9]{3}|300[0-9]|500[0-9]|808[0-9])$") {
                return 403 "Port not allowed. Only 2000-2999, 3000-3009, 5000-5009, 8080-8089 are permitted.";
            }

            proxy_pass http://127.0.0.1:$port/$path$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 根路径提示
        location / {
            return 404 "Use /proxy/<port>/path to access internal services.\n";
        }
    }
}
